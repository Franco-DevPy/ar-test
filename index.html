<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AR Test</title>

  <script async src="https://unpkg.com/es-module-shims@1.7.1/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.174.0/build/three.module.min.js"
      }
    }
  </script>

  <!-- model-viewer-module (without three bundled) is required so it shares the same
       three.js instance as model-viewer-effects; the regular model-viewer.min.js
       bundles its own three.js and breaks the effects addon.
       Versions are pinned: model-viewer-effects 1.5.0 only works with model-viewer
       ^4.1.0 and three ^0.174.0 - the current model-viewer "latest" (4.3.1) needs a
       newer three that removed an export the effects addon still depends on. -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer-module.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer-effects@1.5.0/dist/model-viewer-effects.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #05050a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    h1 {
      margin: 20px 0 10px;
    }

    .show {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .show h2 {
      margin: 8px 0;
      font-size: 18px;
      font-weight: normal;
      color: #aaa;
    }

    model-viewer {
      width: 100vw;
      height: 55vh;
      background-color: #05050a;
      --poster-color: transparent;
    }

    .btn-ar {
      margin-top: 12px;
      padding: 18px 28px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff3d3d, #ff6a6a);
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🚀 Ver modelo en AR</h1>

<div class="show">
  <h2>Modelo 1 - Dotlings</h2>
  <model-viewer
    id="viewer1"
    src="dotlings.glb"
    loading="eager"
    ar
    ar-modes="scene-viewer webxr"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    autoplay
    animation-name="*"
    shadow-intensity="0"
    exposure="1">
    <effect-composer render-mode="quality">
      <bloom-effect strength="2.5" threshold="0.1" radius="0.6" smoothing="0.1"></bloom-effect>
    </effect-composer>
  </model-viewer>
  <button class="btn-ar" onclick="activarAR('viewer1')">VER MODELO 1 EN AR</button>
</div>

<div class="show">
  <h2>Modelo 2 - Snowflake Ball</h2>
  <model-viewer
    id="viewer2"
    src="snowflake_ball.glb"
    loading="eager"
    ar
    ar-modes="scene-viewer webxr"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    autoplay
    animation-name="*"
    shadow-intensity="0"
    exposure="1">
    <effect-composer render-mode="quality">
      <bloom-effect strength="2.5" threshold="0.1" radius="0.6" smoothing="0.1"></bloom-effect>
    </effect-composer>
  </model-viewer>
  <button class="btn-ar" onclick="activarAR('viewer2')">VER MODELO 2 EN AR</button>
</div>

<script>
  function activarAR(id) {
    const viewer = document.getElementById(id);
    viewer.activateAR();
  }
</script>

</body>
</html>
